name: CI Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/build.yml
      - .github/workflows/ci.yml
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  platform-test:
    name: Native tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-2025
          - name: darwin-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

  build-check:
    name: Cross-platform builds
    needs: [test, platform-test]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.sha }}
      release: false
