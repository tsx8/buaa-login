name: Manual Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version and tag
        id: version
        run: |
          version=$(xargs < VERSION)
          tag_name="v$version"

          if [ -z "$version" ]; then
            echo "VERSION is empty" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$tag_name" >/dev/null; then
            echo "Tag $tag_name already exists; refusing to replace an immutable release" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test and vet
        run: |
          go test ./...
          go vet ./...

  build-all:
    needs: [prepare-release, validate]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare-release.outputs.tag_name }}
      release: true

  create-release:
    name: Publish release
    needs: [prepare-release, build-all]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: buaa-login-*
          path: all-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.prepare-release.outputs.tag_name }}
          files: all-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
